spring.application.name=compliance-agent
server.port=8080
app.cors.allowed-origins=http://localhost:3000,http://frontend:3000
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# ── LLM (chat model) ──────────────────────────────────────────────────────────
# Defaults to OpenAI. Override LLM_BASE_URL + LLM_API_KEY to use Groq (free).
#   Groq: base-url = https://api.groq.com/openai/v1  model = llama-3.3-70b-versatile
#   OpenAI: leave blank, set OPENAI_API_KEY
llm.api.key=${LLM_API_KEY:${OPENAI_API_KEY:}}
llm.base-url=${LLM_BASE_URL:}
llm.model=${LLM_MODEL:gpt-4o}
llm.temperature=0.0
# Retries help smooth over Groq/OpenAI-compatible free-tier rate limits during eval runs.
llm.retry.max-attempts=${LLM_RETRY_MAX_ATTEMPTS:4}
llm.retry.initial-backoff-ms=${LLM_RETRY_INITIAL_BACKOFF_MS:1500}
llm.retry.max-backoff-ms=${LLM_RETRY_MAX_BACKOFF_MS:12000}
llm.retry.backoff-multiplier=${LLM_RETRY_BACKOFF_MULTIPLIER:2.0}
llm.retry.jitter-ms=${LLM_RETRY_JITTER_MS:250}

# ── Embedding model ───────────────────────────────────────────────────────────
# Defaults to OpenAI. A non-blank EMBEDDING_BASE_URL switches the app to Nomic's /embedding/text endpoint.
#   Nomic: base-url = https://api-atlas.nomic.ai/v1  model = nomic-embed-text-v1.5
#   OpenAI: leave blank, set OPENAI_API_KEY
embedding.api.key=${EMBEDDING_API_KEY:${OPENAI_API_KEY:}}
embedding.base-url=${EMBEDDING_BASE_URL:}
embedding.model=${EMBEDDING_MODEL:text-embedding-3-small}

# ChromaDB
chroma.base.url=${CHROMA_BASE_URL:http://localhost:8000}

# Cohere re-ranking (free tier — 10,000 calls/month, no credit card)
cohere.api.key=${COHERE_API_KEY:}
cohere.model=rerank-english-v3.0
cohere.base.url=https://api.cohere.com/v1/rerank

# RAG tuning
rag.retrieval.top-k=20
rag.rerank.top-n=5
rag.rerank.enabled=${RERANK_ENABLED:true}
# Parent-child chunking: child chunks are indexed in ChromaDB for precise retrieval;
# parent chunks are returned to the LLM for richer context.
rag.parent.chunk.size=${RAG_PARENT_CHUNK_SIZE:600}
rag.child.chunk.size=${RAG_CHILD_CHUNK_SIZE:150}

# Tavily web search (optional — used for live market data in deal analysis)
tavily.api.key=${TAVILY_API_KEY:}

# LangSmith observability (optional — free tier at smith.langchain.com)
langsmith.api.key=${LANGSMITH_API_KEY:}
langsmith.project=compliance-agent
langsmith.base.url=https://api.smith.langchain.com

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Do not leak framework error details to clients.
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never

# WebFlux codec — allow large document payloads
spring.codec.max-in-memory-size=10MB

# Logging
logging.level.com.compliance=INFO
logging.level.dev.langchain4j=WARN
